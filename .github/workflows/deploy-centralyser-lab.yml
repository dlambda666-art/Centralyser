name: Deploy Centralyser Lab

on:
  push:
    branches: [lab/centralyser-search-fix]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab branch
        uses: actions/checkout@v4
        with:
          ref: lab/centralyser-search-fix

      - name: Sync lab to Hugging Face
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: dlambda666-art/Centralyser
          huggingface_repo_id: Lambda666/Centralyser-Lab
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: docker
          private: false
