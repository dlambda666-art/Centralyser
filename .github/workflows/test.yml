name: Test Centralyser

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start Centralyser
        run: |
          npm start > server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:7860/health >/dev/null; then break; fi
            sleep 1
          done
      - name: Validate empty configuration
        run: |
          curl -fsS http://127.0.0.1:7860/health
          curl -fsS http://127.0.0.1:7860/manifest.json > manifest.json
          node -e 'const m=require("./manifest.json"); if(m.name!=="Centralyser") throw new Error("Invalid manifest name"); if(!Array.isArray(m.catalogs)) throw new Error("catalogs must be an array"); console.log(`OK: empty state has ${m.catalogs.length} catalogs`);'
      - name: Validate admin API
        run: |
          curl -fsS http://127.0.0.1:7860/api/addons > addons.json
          node -e 'const d=require("./addons.json"); if(!Array.isArray(d.addons)) throw new Error("Invalid addons response"); console.log(`OK: ${d.addons.length} configured addons`);'
      - name: Show server log on failure
        if: failure()
        run: cat server.log
