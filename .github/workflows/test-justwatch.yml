name: Test JustWatch Dates addon

on:
  push:
    branches: [lab/justwatch-dates]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/justwatch-dates
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start addon
        run: |
          npm start > server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:7860/health >/dev/null; then break; fi
            sleep 1
          done
      - name: Validate manifest and health
        run: |
          curl -fsS http://127.0.0.1:7860/health
          curl -fsS http://127.0.0.1:7860/manifest.json > manifest.json
          node -e 'const m=require("./manifest.json"); if(m.id!=="com.dlambda.justwatch-dates") throw new Error("Bad id"); if(!m.catalogs?.length) throw new Error("No catalogs"); console.log("OK:",m.name,m.catalogs.length);'
      - name: Show log on failure
        if: failure()
        run: cat server.log
