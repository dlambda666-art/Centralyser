name: DuckStreams Proxy Integration Test

on:
  push:
    branches: [duckstreams-lab]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check server-fixed.js
      - name: Test DuckStreams endpoint
        run: node duckstreams-proxy-test.mjs
